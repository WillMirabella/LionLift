[pytest]
# Run from the backend folder with: python -m pytest
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
# A known-bug test that starts passing fails the run, so the marker gets removed
xfail_strict = true
markers =
    db: needs a PostgreSQL server (skipped locally when none is running, required in CI)
    system: runs the whole backend as a real HTTP server
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
